[project]
name = "operational-sop-assistant"
version = "0.1.0"
description = "Document-grounded operational SOP assistant with Qdrant and source citations"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "qdrant-client>=1.15,<2",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "huggingface-hub>=2.3.0",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "pylint>=3,<5"]
eval = ["ragas>=0.4,<0.5", "langchain-community==0.3.31", "langchain<1", "langchain-openai<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sop_assistant"]

[project.scripts]
sop = "sop_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
